name: Vercel Preview Deployment

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  push:
    branches: [ develop ]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview-deploy:
    runs-on: ubuntu-latest
    # Use environment protection for PRs only
    environment: ${{ github.event_name == 'pull_request_target' && 'pr-approval' || null }}
    # Upstream-only (needs upstream Vercel secrets); skipped in forks.
    if: github.repository == 'adamws/kle-ng' && github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the PR's head repo and branch for PRs, or the pushed commit for develop
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_BACKEND_URL: https://kicad.vps.keyboard-tools.xyz
          # Previews get their own Supabase project, never production's.
          #
          # Set unconditionally: `vercel build` runs in production mode and would
          # otherwise read VITE_SUPABASE_* straight out of .env.production, pointing
          # every preview at the live database. Process env overrides .env files in
          # Vite, so these always win. When the secrets are absent (fork PRs) they
          # resolve to empty, which disables accounts rather than leaking production
          # credentials.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PREVIEW }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PREVIEW }}
          # No shared password-account credentials (VITE_TEST_USER_*) are configured
          # here: the preview project has password sign-in disabled. See
          # supabase/README.md.
          #
          # Marks the bundle as a preview build: stamps the header title and makes the
          # footer version link to the commit it was built from. Not set for the GitHub
          # Pages production build, which keeps linking to the release tag.
          VITE_DEPLOY_ENV: preview
          # The commit actually checked out above: the PR head for pull_request_target
          # (where github.sha is the merge commit), the pushed commit for develop.
          VITE_GIT_COMMIT_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$url" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Preview deployment ready!**

              **Preview URL:** ${{ steps.deploy.outputs.preview-url }}

              Built from commit: ${context.sha.substring(0, 7)}
              **View changes:** [Compare with master](https://github.com/${{ github.repository }}/compare/master...${context.sha})`
            })

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.repository == 'adamws/kle-ng' && github.event.action == 'closed'

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Preview deployment cleaned up** - PR has been closed.'
            })
